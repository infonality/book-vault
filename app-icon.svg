<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Shelfmark app icon.
       Three spines on a shelf, the third leaning; deep plum tile with lavender
       spines. Three solid shapes, no strokes, so it holds up small. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b0764"/>
      <stop offset="0.55" stop-color="#240a45"/>
      <stop offset="1" stop-color="#12031f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="225" fill="url(#gloss)"/>

  <rect x="252" y="282" width="150" height="530" rx="40" fill="#ede9fe"/>
  <rect x="437" y="242" width="150" height="570" rx="40" fill="#a78bfa"/>
  <rect x="622" y="282" width="150" height="530" rx="40" fill="#ede9fe" transform="rotate(13 697 812)"/>
</svg>
