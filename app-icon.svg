<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Book Vault app icon.
       A single bookmark silhouette, split into two tones, with a deep V notch
       (V for Vault). One shape, no strokes, so it stays legible at 16px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mark">
      <path d="M 302,240 A 60,60 0 0 1 362,180 L 662,180 A 60,60 0 0 1 722,240
               L 722,864 L 512,700 L 302,864 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="225" fill="url(#gloss)"/>

  <!-- Bookmark: amber base, white upper section clipped to the same silhouette -->
  <path d="M 302,240 A 60,60 0 0 1 362,180 L 662,180 A 60,60 0 0 1 722,240
           L 722,864 L 512,700 L 302,864 Z" fill="#f59e0b"/>
  <rect x="290" y="160" width="444" height="400" fill="#ffffff" clip-path="url(#mark)"/>
</svg>
