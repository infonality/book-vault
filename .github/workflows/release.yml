name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# CI then builds native installers on each OS and attaches them to a DRAFT
# GitHub Release for you to review and publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  release:
    permissions:
      contents: write # needed to create the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Apple Silicon + Intel) -> .dmg / .app
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            pdfium_asset: "pdfium-mac-univ.tgz"
            pdfium_member: "lib/libpdfium.dylib"
            pdfium_dest: "src-tauri/libpdfium.dylib"
          # Linux -> .deb (Mint/Ubuntu), .rpm (Fedora), .AppImage (portable)
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            pdfium_asset: "pdfium-linux-x64.tgz"
            pdfium_member: "lib/libpdfium.so"
            pdfium_dest: "src-tauri/libpdfium.so"
          # Windows -> .msi + NSIS .exe installer
          - platform: windows-latest
            args: ""
            rust_targets: ""
            pdfium_asset: "pdfium-win-x64.tgz"
            pdfium_member: "bin/pdfium.dll"
            pdfium_dest: "src-tauri/pdfium.dll"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libfuse2 \
            file

      # PDFium powers PDF first-page cover rendering. Fetch the platform's
      # prebuilt library so it gets bundled as an app resource.
      - name: Fetch PDFium
        shell: bash
        run: |
          curl -sL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}"
          tar -xzf pdfium.tgz "${{ matrix.pdfium_member }}"
          cp "${{ matrix.pdfium_member }}" "${{ matrix.pdfium_dest }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Book Vault ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
